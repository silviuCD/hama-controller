name: Build Hama Controller APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK & Build App
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          mkdir -p app/src/main/java/com/silviu/hama

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HamaController"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.silviu.hama'
              compileSdk 34
              defaultConfig {
                  applicationId "com.silviu.hama"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
              <application
                  android:label="Hama Controller"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/silviu/hama/MainActivity.kt
          package com.silviu.hama

          import android.app.Activity
          import android.app.TimePickerDialog
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.text.InputType
          import android.view.Gravity
          import android.widget.*
          import java.io.OutputStreamWriter
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Calendar
          import kotlin.concurrent.thread

          class MainActivity : Activity() {
              private lateinit var ipInput: EditText
              private lateinit var statusText: TextView
              private lateinit var alarmStatusText: TextView

              private var alarmHour = 7
              private var alarmMinute = 0
              private var isAlarmActive = false
              private val handler = Handler(Looper.getMainLooper())
              private var alarmRunnable: Runnable? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("hama", MODE_PRIVATE)

                  val root = ScrollView(this).apply {
                      setBackgroundColor(Color.parseColor("#121212"))
                  }
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 64, 48, 64)
                  }

                  val title = TextView(this).apply {
                      text = "Hama SIRIUM1000ABT"
                      textSize = 24f
                      setTextColor(Color.parseColor("#E53935"))
                      setPadding(0, 0, 0, 32)
                  }
                  layout.addView(title)

                  ipInput = EditText(this).apply {
                      setText(prefs.getString("ip", "10.220.9.47"))
                      hint = "IP Boxa (ex: 10.220.9.47)"
                      setTextColor(Color.WHITE)
                      setHintTextColor(Color.GRAY)
                      inputType = InputType.TYPE_CLASS_TEXT
                      background = roundedBg("#2C2C2C")
                      setPadding(32, 28, 32, 28)
                  }
                  layout.addView(ipInput)

                  val volLabel = TextView(this).apply {
                      text = "Volum: 25%"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      setPadding(0, 36, 0, 12)
                  }
                  layout.addView(volLabel)

                  val seekBar = SeekBar(this).apply {
                      max = 100
                      progress = 25
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                              volLabel.text = "Volum: " + p + "%"
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {
                              val v = s?.progress ?: 25
                              sendWebCommand("volume", v.toString())
                          }
                      })
                  }
                  layout.addView(seekBar)

                  val transportRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, 24, 0, 36)
                  }
                  val lp = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f).apply {
                      setMargins(8, 0, 8, 0)
                  }
                  transportRow.addView(makeButton("Play", "#E53935") {
                      sendWebCommand("play", "1")
                  }, lp)
                  transportRow.addView(makeButton("Pause", "#424242") {
                      sendWebCommand("pause", "1")
                  }, lp)
                  transportRow.addView(makeButton("Stop", "#424242") {
                      sendWebCommand("stop", "1")
                  }, lp)
                  layout.addView(transportRow)

                  val alarmTitle = TextView(this).apply {
                      text = "Ceas Desteptator / Programator Radio:"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      setPadding(0, 12, 0, 16)
                  }
                  layout.addView(alarmTitle)

                  alarmStatusText = TextView(this).apply {
                      text = "Alarma oprita (Setata la 07:00 - Rock FM)"
                      textSize = 14f
                      setTextColor(Color.LTGRAY)
                      setPadding(0, 0, 0, 12)
                  }
                  layout.addView(alarmStatusText)

                  val timeBtn = makeButton("Alege ora alarma (07:00)", "#2C2C2C") {
                      val cal = Calendar.getInstance()
                      TimePickerDialog(this, { _, h, m ->
                          alarmHour = h
                          alarmMinute = m
                          alarmStatusText.text = String.format("Alarma oprita (Setata la %02d:%02d - Rock FM)", h, m)
                      }, alarmHour, alarmMinute, true).show()
                  }
                  layout.addView(timeBtn)

                  val alarmToggleBtn = makeButton("Activeaza Alarma Radio", "#2E7D32") { btn ->
                      isAlarmActive = !isAlarmActive
                      if (isAlarmActive) {
                          alarmToggleBtnText(btn, "Opreste Alarma", "#C62828")
                          alarmStatusText.text = String.format("⏰ Alarma ACTIVA pentru %02d:%02d", alarmHour, alarmMinute)
                          startAlarmChecker("https://live.rockfm.ro/rockfm.aacp")
                      } else {
                          alarmToggleBtnText(btn, "Activeaza Alarma Radio", "#2E7D32")
                          alarmStatusText.text = String.format("Alarma oprita (Setata la %02d:%02d)", alarmHour, alarmMinute)
                          stopAlarmChecker()
                      }
                  }

                  val radioTitle = TextView(this).apply {
                      text = "Posturi Radio Online:"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      setPadding(0, 24, 0, 16)
                  }
                  layout.addView(radioTitle)

                  val stations = listOf(
                      "Rock FM" to "https://live.rockfm.ro/rockfm.aacp",
                      "Radio Guerrilla" to "https://live.guerrillaradio.ro:8443/guerrilla.aac",
                      "Europa FM" to "https://astreaming.edi.ro:8443/EuropaFM_aac",
                      "Digi FM" to "https://edge76.rcs-rds.ro/digifm/digifm.mp3",
                      "Kiss FM" to "https://live.kissfm.ro/kissfm.aacp"
                  )

                  for ((name, url) in stations) {
                      layout.addView(makeButton("Play: " + name, "#1E1E1E") {
                          playStream(name, url)
                      })
                  }

                  statusText = TextView(this).apply {
                      text = "Pregatit. Introdu IP-ul boxei."
                      textSize = 14f
                      setTextColor(Color.LTGRAY)
                      gravity = Gravity.CENTER
                      setPadding(0, 48, 0, 0)
                  }
                  layout.addView(statusText)

                  root.addView(layout)
                  setContentView(root)
              }

              private fun alarmToggleBtnText(btn: android.view.View, text: String, hexColor: String) {
                  (btn as Button).text = text
                  btn.background = roundedBg(hexColor)
              }

              private fun startAlarmChecker(streamUrl: String) {
                  alarmRunnable = object : Runnable {
                      override fun run() {
                          if (isAlarmActive) {
                              val now = Calendar.getInstance()
                              if (now.get(Calendar.HOUR_OF_DAY) == alarmHour && now.get(Calendar.MINUTE) == alarmMinute) {
                                  playStream("Alarma Radio", streamUrl)
                                  isAlarmActive = false
                                  alarmStatusText.text = "Alarma declansata!"
                                  return
                              }
                              handler.postDelayed(this, 30000)
                          }
                      }
                  }
                  handler.post(alarmRunnable!!)
              }

              private fun stopAlarmChecker() {
                  alarmRunnable?.let { handler.removeCallbacks(it) }
              }

              private fun roundedBg(hex: String) = GradientDrawable().apply {
                  setColor(Color.parseColor(hex))
                  cornerRadius = 24f
              }

              private fun makeButton(label: String, colorHex: String, onClick: (android.view.View) -> Unit): Button {
                  return Button(this).apply {
                      text = label
                      setTextColor(Color.WHITE)
                      isAllCaps = false
                      textSize = 15f
                      background = roundedBg(colorHex)
                      val params = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { setMargins(0, 14, 0, 14) }
                      layoutParams = params
                      setOnClickListener { onClick(this) }
                  }
              }

              private fun playStream(name: String, url: String) {
                  statusText.text = "Se trimite " + name + "..."
                  thread {
                      val ok = webCall("play_url?url=" + url)
                      runOnUiThread {
                          statusText.text = if (ok) "Reda acum: " + name else "Comanda trimisa la boxa."
                      }
                  }
              }

              private fun sendWebCommand(action: String, value: String) {
                  val host = ipInput.text.toString().trim()
                  getSharedPreferences("hama", MODE_PRIVATE).edit().putString("ip", host).apply()
                  thread {
                      webCall(action + "?val=" + value)
                  }
              }

              private fun webCall(endpoint: String): Boolean {
                  return try {
                      val host = ipInput.text.toString().trim()
                      val url = URL("http://" + host + "/" + endpoint)
                      val conn = (url.openConnection() as HttpURLConnection).apply {
                          requestMethod = "GET"
                          connectTimeout = 3000
                          readTimeout = 3000
                      }
                      val code = conn.responseCode
                      conn.disconnect()
                      code in 200..299
                  } catch (e: Exception) {
                      false
                  }
              }
          }
          EOF

          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hama-Controller-APK
          path: app/build/outputs/apk/debug/app-debug.apk
